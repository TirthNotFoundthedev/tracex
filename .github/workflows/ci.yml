name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.16"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  data-kit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-kit
    steps:
      - uses: actions/checkout@v4
      - name: Skip notice
        if: hashFiles('data-kit/tests/**') == ''
        run: echo "data-kit/tests not found; data-kit checks skipped until the data kit lands."
      - uses: astral-sh/setup-uv@v5
        if: hashFiles('data-kit/tests/**') != ''
        with:
          version: "0.12.16"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - if: hashFiles('data-kit/tests/**') != ''
        run: uv sync --frozen --project ../backend
      - if: hashFiles('data-kit/tests/**') != ''
        run: uv run --project ../backend ruff check .
      - if: hashFiles('data-kit/tests/**') != ''
        run: uv run --project ../backend ruff format --check .
      - if: hashFiles('data-kit/tests/**') != ''
        run: uv run --project ../backend mypy
      - if: hashFiles('data-kit/tests/**') != ''
        run: uv run --project ../backend pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Hindi i18n keys match English
        run: npm run check:i18n
      - run: npm test
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait --wait-timeout 240
      - run: curl --fail http://localhost:8000/health
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
