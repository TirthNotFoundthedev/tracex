        - REVIEW_QUEUE_VIEWED
        - EXPLANATION_VIEWED
        - SOURCE_LINES_VIEWED
        - SEARCH_RUN
        - ACCESS_DENIED
        - LINKS_LISTED
        - LINK_AUTO_CREATED
        - LINK_SUGGESTED
        - LINK_DEMOTED
        - LINK_CONFIRMED
        - LINK_REJECTED
        - LINK_UNDONE
        - LINK_REOPENED
        - ACCESS_REQUEST_CREATED
        - ACCESS_REQUEST_WITHDRAWN
        - ACCESS_REQUEST_EXPIRED
        - ACCESS_REQUEST_APPROVED
        - ACCESS_REQUEST_REJECTED
        - ACCESS_GRANT_REVOKED
        - ACCESS_GRANT_EXPIRED
        - ACCESS_GRANT_CLOSED
        - DATA_UPLOADED
        - MATCHING_RUN_STARTED
        - MATCHING_RUN_COMPLETED
        - CHANGE_PROPOSED
        - CHANGE_APPROVED
        - CHANGE_DENIED
        - ASSIGNMENT_CHANGED
        - USER_CREATED
        - USER_ENABLED
        - USER_DISABLED
        - AUDIT_VIEWED
        - AUDIT_VERIFY_RUN
        - LINK_PROMOTED
        - LINK_WITHDRAWN
