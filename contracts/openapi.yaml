openapi: 3.1.0
info:
  title: TraceX API
  version: 0.1.0
  summary: Cross-case entity resolution API for police case data (synthetic data only).
  description: |
    The only interface between the apps and the backend. Specs: `docs/specs/api-access-control.md` (canonical for
    roles, relations and rules R1-R6), `docs/specs/api-audit-log.md`, `docs/specs/engine-matching.md`.
    Architecture and data model: `docs/architecture.md`.

    ## Conventions that apply to every operation

    **Order of checks (R2).** Authenticate (401) -> can the caller see that the thing exists? If not, **404**, never
    403 -> does the role permit it? (403) -> is the state valid? (409) -> is the input valid? (422).
    "Exists" means ALLOW on the resource: a REDACTED link, a hidden case, another user's access request, grant or
    pending change all answer 404 by id. The 404 body and headers are identical for an unknown id and a hidden id.

    **ADMIN has no case-data rights.** Every case-data operation (cases, entities, links, stubs, explanations, graph,
    clusters, paths, search, source lines, review queue) answers an ADMIN with the same 404 (access spec A31).

    **Extensions on every operation.**
    - `x-required-role`: the lowest role that may attempt it, or the set when not a ladder.
    - `x-jurisdiction`: the case-relation rule (own case / own jurisdiction / other jurisdiction) from the access matrix.
    - `x-audit-event`: the audit event written on success (api-audit-log section 3). Denials always write
      `ACCESS_DENIED`; authentication failures write `AUTH_TOKEN_REJECTED`. `NONE` means the operation returns no case
      data and no audited state change (denials are still audited); each `NONE` is justified in `x-audit-note`.
    - `x-audit-note`: optional, explains a non-obvious audit behaviour.

    **Errors.** One model, `Error`. Strings are fixed per code and never derived from hidden data. No error response
    carries `X-Request-Id` or any per-request value: the 404 for a hidden id must be byte-identical to the 404 for a
    random id. Correlation lives in the private `request_id` audit column.

    **Paging.** List operations take `limit` and an opaque `cursor`. Every cursor is encrypted (authenticated encryption, server key), bound to the reader and the filters it was issued for, and expires after 15 minutes. It carries the visible sort key and an opaque row reference as position, never a sequence number or an id. A cursor presented by another reader, with different filters, expired or altered answers `422 VALIDATION_FAILED` exactly like a malformed one. Counts (`total`, queue sizes) count items the caller may see (ALLOW) only.

    **Masking.** PHONE and ACCOUNT values are masked on the server unless the caller may read source lines of that case (access spec section 4.1). A masked value appears nowhere in the response; `masked` is true on any object where a value was masked.

    **Caching.** Every response carrying case data sends `Cache-Control: no-store`.

    **Ids.** Link, stub, request, grant, change, batch, run and cluster ids are random UUIDs; none is derived from
    entity, case or run ids. Stub ids are bound to (caller, link).
  license:
    name: Proprietary (hackathon prototype)
    identifier: LicenseRef-TraceX
servers:
  - url: /
    description: Same origin as the apps; local compose maps it to port 8000.
tags:
  - name: auth
    description: Login, refresh rotation, logout.
  - name: cases
    description: Cases, entities, search, source lines.
  - name: links
    description: SAME_AS links, decisions, explanations, review queue.
  - name: graph
    description: Per-viewer graph neighbours, identity clusters, paths.
  - name: access
    description: Stubs, access requests, grants.
  - name: ingest
    description: Uploads and matching runs (ADMIN).
  - name: admin
    description: Users, roles, jurisdictions, thresholds, pending changes.
  - name: audit
    description: Audit log read and chain verification.
  - name: system
    description: Health and readiness.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags:
        - system
      operationId: getHealth
      summary: Liveness
      security: []
      x-required-role: none (unauthenticated)
      x-jurisdiction: not applicable (no case data)
      x-audit-event: NONE
      x-audit-note: Liveness probe; returns no data and changes nothing.
      responses:
        "200":
          description: Process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ready:
    get:
      tags:
        - system
      operationId: getReady
      summary: Readiness (database, graph store, audit chain startup check)
      security: []
      x-required-role: none (unauthenticated)
      x-jurisdiction: not applicable (no case data)
      x-audit-event: NONE
      x-audit-note: Readiness probe; fails with 503 while the audit chain check (last 1000 rows plus anchor) fails. Returns no data.
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Not ready. Body is the fixed `NOT_READY` error (the same body as the safety pause).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyPauseError"
  /auth/login:
    post:
      tags:
        - auth
      operationId: login
      summary: Sign in with a seeded username and password
      description: |
        Access token 15 minutes, refresh token 8 hours absolute. Claims: `sub`, `sid`, `iat`, `exp`, `jti`, `ver`;
        role and jurisdiction are never claims. Five failed logins per (username string, IP) in 15 minutes give 429 for
        15 minutes, whether or not the username exists. There is no route to set or reset a password.
      security: []
      x-required-role: none (unauthenticated)
      x-jurisdiction: not applicable
      x-audit-event: AUTH_LOGIN_SUCCESS
      x-audit-note: Failure writes AUTH_LOGIN_FAILED (with `throttled`); `claimed_username` is stored raw only if it equals an existing username, else as hmac:<16 hex>.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/SafetyPause"
  /auth/refresh:
    post:
      tags:
        - auth
      operationId: refreshToken
      summary: Rotate a refresh token
      description: |
        Single use. Presenting a rotated refresh token again revokes the whole session (`sid`) and is audited.
      security: []
      x-required-role: none (refresh token is the credential)
      x-jurisdiction: not applicable
      x-audit-event: AUTH_REFRESHED
      x-audit-note: Reuse of a rotated token writes AUTH_REFRESH_REUSED and returns 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/SafetyPause"
  /auth/logout:
    post:
      tags:
        - auth
      operationId: logout
      summary: End the current session
      description: Marks the session dead in the database; the access token stops working at once.
      x-required-role: any authenticated user
      x-jurisdiction: not applicable
      x-audit-event: AUTH_LOGOUT
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/SafetyPause"
  /me:
    get:
      tags:
        - auth
      operationId: getMe
      summary: The signed-in user, read from the database
      x-required-role: any authenticated user
      x-jurisdiction: not applicable (the caller's own row)
      x-audit-event: NONE
      x-audit-note: Returns the caller's own account fields only; no case data.
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/SafetyPause"
  /cases:
    get:
      tags:
        - cases
      operationId: listCases
      summary: Cases the caller may see (own cases and own jurisdiction)
      description: |
        `district_id` and `case_number` filters only narrow; they never widen scope (A42). `linked_item_count` counts
        ALLOW links only.
      x-required-role: JUNIOR (all roles except ADMIN)
      x-jurisdiction: own case A / own jurisdiction A / other jurisdiction D (rows outside scope do not exist). ADMIN 404.
      x-audit-event: CASE_LISTED
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: case_number
          in: query
          description: Prefix match on the case number (officer app search).
          schema:
            type: string
            maxLength: 64
        - name: district_id
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: A page of cases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/SafetyPause"
  /cases/{case_id}/entities:
    get:
      tags:
        - cases
      operationId: listCaseEntities
      summary: A case and its entities (people, phones, accounts, vehicles)
      description: |
        Returns the case header and the entities of that case. `link_count` counts ALLOW links only;
        `has_hidden_connection` is true when at least one stub exists for the entity; `needs_review` is true when an
        ALLOW SUGGESTED link waits on the entity. Low-band pairs are never stored and appear nowhere.
      x-required-role: JUNIOR (all roles except ADMIN)
      x-jurisdiction: own case A / own jurisdiction A / other jurisdiction D. Hidden case and ADMIN answer 404.
      x-audit-event: CASE_ENTITIES_VIEWED
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/EntityType"
      responses:
        "200":
          description: The case and a page of its entities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseEntitiesPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/SafetyPause"
  /entities/{entity_id}:
    get:
      tags:
        - cases
      operationId: getEntity
      summary: One entity with its visible links and stubs
      description: "`links` are ALLOW links (at most 50, newest first; page the rest with `GET /links?entity_id=`). `stubs` are one per hidden link, same shape whatever the link state, ordered by `stub_id`, after the visible items. A stub never carries far-side fields. Under a grant (`via_grant` true) the far entity shows only the granted link: `link_count` 1, `has_hidden_connection` false, `needs_review` false, `stubs` empty, provenance only for the cited lines."
      x-required-role: JUNIOR (all roles except ADMIN)
      x-jurisdiction: own case A / own jurisdiction A / other jurisdiction D; far entity under an active grant A for that one link only. Hidden entity and ADMIN answer 404.
      x-audit-event: ENTITY_VIEWED
      x-audit-note: A response that shows stubs also writes STUB_VIEWED (one row per response). `via_grant` is true when access came from a grant.
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: The entity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/SafetyPause"
  /search/entities:
    get:
      tags:
        - cases
      operationId: searchEntities
      summary: Find entities by value
      description: |
        Matches ALLOW entities only. A value that exists only in a hidden entity returns the same empty result as no
        match, with no stubs. Search terms are never stored in the audit log.
      x-required-role: JUNIOR (all roles except ADMIN)
      x-jurisdiction: own case A / own jurisdiction A / other jurisdiction D (hidden entities never match). ADMIN 404.
      x-audit-event: SEARCH_RUN
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/EntityType"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Matching entities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/SafetyPause"
  /documents/{document_id}/lines:
    get:
      tags:
        - cases
      operationId: getSourceLines
      summary: Source lines of a document
      description: |
        By role and relation: JUNIOR own case only; INVESTIGATOR and above own case and own jurisdiction. Under a
        grant, only the exact cited line ranges fixed at approval, and never for a JUNIOR (role cap). Answers 403 when
        the case is visible to the caller but the role cell is DENY (a JUNIOR in own jurisdiction, A4) and for a range
        outside the grant's fixed ranges on a document the grant covers (A23). A document of a hidden case, an unknown
        id and any call by ADMIN answer 404.
      x-required-role: JUNIOR (own case only), INVESTIGATOR and above (own jurisdiction)
      x-jurisdiction: own case A (JUNIOR+) / own jurisdiction A (INVESTIGATOR+), D for JUNIOR / other jurisdiction D; grant gives only the fixed cited ranges, capped by role
      x-audit-event: SOURCE_LINES_VIEWED
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: line_from
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: line_to
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The requested lines (at most 200).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceLines"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/SafetyPause"
  /links:
    get:
      tags:
        - links
      operationId: listLinks
      summary: Links the caller may see, plus stubs for those they may not
      description: "ALLOW links first, then stubs ordered by `stub_id`. Stubs appear only for links with an end on a visible entity of the caller. **The stub set never depends on `state` or `entity_type`**: those filters narrow the visible links only, so stub counts cannot reveal the state of a hidden link. `total` counts ALLOW links only. Rejected and undone links are listed only when `state` asks for them. For decision work use `GET /review-queue`."
      x-required-role: JUNIOR (all roles except ADMIN)
      x-jurisdiction: both ends own case or own jurisdiction A; one end hidden R (stub); ADMIN 404
      x-audit-event: LINKS_LISTED
      x-audit-note: A response with stubs also writes STUB_VIEWED.
      parameters:
        - name: entity_id
          in: query
          description: Only links touching this entity (must be visible, else 404).
          schema:
            $ref: "#/components/schemas/Id"
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/LinkState"
        - name: entity_type
          in: query
          schema:
            $ref: "#/components/schemas/EntityType"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of links and stubs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/SafetyPause"
  /links/{link_id}:
    get:
      tags:
        - links
      operationId: getLink
      summary: One link in full
      description: |
        Only when the caller has ALLOW on both end cases (or an active grant on this link). A REDACTED link answers the
        same 404 as a random id. The response says which decisions this caller may take (`allowed_actions`) and, when
        none, why in a code (`decision_block`), so the app can show the right line without re-deriving rules.
      x-required-role: JUNIOR (all roles except ADMIN)
      x-jurisdiction: both ends A (own case or own jurisdiction); either end other jurisdiction R -> 404 by id (use the stub); active grant on this link A read-only
      x-audit-event: LINK_VIEWED
      parameters:
        - $ref: "#/components/parameters/LinkId"
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/SafetyPause"
  /links/{link_id}/explanation:
    get:
      tags:
        - links
      operationId: getLinkExplanation
      summary: Why the link exists (explanation payload)
      description: |
        Returns the payload of `explanation.schema.json`: codes, numbers and ids; wording is rendered by the client from
        `template_key` and `params`. A REDACTED link answers 404; use the stub. Under a grant the cited-line set is
        fixed at approval.
      x-required-role: JUNIOR (all roles except ADMIN)
      x-jurisdiction: both ends A; either end other jurisdiction R -> 404 by id; active grant on this link A
      x-audit-event: EXPLANATION_VIEWED
      parameters:
        - $ref: "#/components/parameters/LinkId"
      responses:
        "200":
          description: The explanation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Explanation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/SafetyPause"
  /links/{link_id}/confirm:
    post:
      tags:
        - links
      operationId: confirmLink
      summary: Confirm a SUGGESTED or AUTO link
      description: |
        SUGGESTED -> CONFIRMED and AUTO -> CONFIRMED. Both end cases must be ALLOW for the caller by their own scope
        (R3); a link across districts or states is decided only by a SENIOR whose coverage includes both ends; a grant
        never qualifies (403, `decision_block` GRANT_READ_ONLY). Any other source state answers 409
        `INVALID_TRANSITION`.
        While a matching run is RUNNING this answers 409 `RUN_IN_PROGRESS` (state unchanged).
      x-required-role: INVESTIGATOR
      x-jurisdiction: both ends own case or own jurisdiction A (same district); cross-district or cross-state needs SENIOR with coverage of both ends; other jurisdiction -> 404 (hidden end); grant -> 403
      x-audit-event: LINK_CONFIRMED
      parameters:
        - $ref: "#/components/parameters/LinkId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmLinkRequest"
      responses:
        "200":
          description: The link after the decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/SafetyPause"
  /links/{link_id}/reject:
    post:
      tags:
        - links
      operationId: rejectLink
      summary: Reject a SUGGESTED link
      description: |
        SUGGESTED -> REJECTED with a required reason. An AUTO link cannot be rejected (409 `INVALID_TRANSITION`);
        it can only be undone. The rejected pair joins the block list (the REJECTED edge itself); it is never proposed
        again. The reason is stored on the link history, never in the audit log.
        While a matching run is RUNNING this answers 409 `RUN_IN_PROGRESS` (state unchanged).
      x-required-role: INVESTIGATOR
      x-jurisdiction: both ends own case or own jurisdiction A (same district); cross-district or cross-state needs SENIOR with coverage of both ends; hidden end -> 404; grant -> 403
      x-audit-event: LINK_REJECTED
      parameters:
        - $ref: "#/components/parameters/LinkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkReasonRequest"
      responses:
        "200":
          description: The link after the decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/SafetyPause"
  /links/{link_id}/undo:
    post:
      tags:
        - links
      operationId: undoLink
      summary: Undo an AUTO or CONFIRMED link
      description: |
        AUTO -> UNDONE or CONFIRMED -> UNDONE with a required reason. Entities, provenance and the edge with its
        history remain; the pair is not auto-linked again; clusters split on the next read.
        While a matching run is RUNNING this answers 409 `RUN_IN_PROGRESS` (state unchanged).
      x-required-role: SUPERVISOR
      x-jurisdiction: both ends own case or own jurisdiction A (same district); cross-district or cross-state needs SENIOR with coverage of both ends (A18); hidden end -> 404; grant -> 403
      x-audit-event: LINK_UNDONE
      parameters:
        - $ref: "#/components/parameters/LinkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkReasonRequest"
      responses:
        "200":
          description: The link after the decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/SafetyPause"
  /links/{link_id}/reopen:
    post:
      tags:
        - links
      operationId: reopenLink
      summary: Reopen a REJECTED or UNDONE link as SUGGESTED
      description: |
        REJECTED -> SUGGESTED and UNDONE -> SUGGESTED with a required reason (D34: surfaced in the admin panel review queue under the Rejected filter). A reopened pair is ended only by a human (CONFIRMED, or REJECTED again); it never becomes AUTO and a rerun never withdraws it.
        While a matching run is RUNNING this answers 409 `RUN_IN_PROGRESS` (state unchanged).
      x-required-role: SUPERVISOR
