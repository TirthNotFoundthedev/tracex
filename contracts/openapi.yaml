        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/SafetyPause"
  /audit:
    get:
      tags:
        - audit
      operationId: listAudit
      summary: Read the audit log under the row-level rule
      description: |
        JUNIOR and INVESTIGATOR: 403. SUPERVISOR, SENIOR and ADMIN read under one row-level rule; a row exists for the
        reader only if:
        (a) the reader is the actor; or
        (b) the actor is in the reader's chain of command (SUPERVISOR or SENIOR: actor district inside their scope or
        coverage), including the actor's denied probes; or
        (c) `refs` is non-empty and the reader has ALLOW on every case in `refs`, judged by **case-level access**
        (own case, own jurisdiction or coverage); a grant never counts; or
        (d) the row **references no cases** (`refs` empty) and is a system event (AUTH_*, DATA_UPLOADED, MATCHING_RUN_*, CHANGE_*, USER_*, AUDIT_*) and the reader is ADMIN, or a SENIOR for whom every user and district the row names (the actor's district, the target, the subject, old and new values, `claimed_username` and `claimed_sub`; an actor without a jurisdiction, such as ADMIN or SYSTEM, does not count) lies inside their coverage. An all-state SENIOR sees every such row. Rule (d) never admits a row that references a case.

        Rows that fail the rule do not exist for the reader: no placeholder, no gap, no count. For a row shown under (a)
        or (b) that references a case the reader cannot see, hidden `refs` entries, every field owned by those cases
        and every joint field are dropped (keys absent, not null). Every `detail` key has an owning case
        (`audit_detail_key_owner`): a key whose owning case is not in `refs` cannot be written.

        Filters, sorting and paging run only over the rows and fields the reader can see. A filter on a value the reader
        cannot see returns exactly what a filter on a non-existent value returns: same empty page, `result_count` 0 and
        `next_cursor` null. The cursor is signed and bound to the reader and the filters (see Paging above). Rows carry
        an opaque `row_ref` (HMAC of the row and the reader), never a sequence number, hash or nonce. There is no
        export.
      x-required-role: SUPERVISOR (SENIOR and ADMIN also; JUNIOR and INVESTIGATOR 403)
      x-jurisdiction: row-level rule (a)-(d) above, not the case matrix; SUPERVISOR scope = own district, SENIOR = coverage, ADMIN = system events and own rows
      x-audit-event: AUDIT_VIEWED
      x-audit-note: Written before the page is returned (fail closed), with filter names only, `result_count` and whether any field was dropped. It is not part of the page it logs.
      parameters:
        - name: event_type
          in: query
          schema:
            $ref: "#/components/schemas/AuditEventType"
        - name: outcome
          in: query
          schema:
            type: string
            enum:
              - SUCCESS
              - DENIED
              - FAILED
        - name: actor_user_id
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: case_id
          in: query
          schema:
            type: string
            maxLength: 64
        - name: target_id
          in: query
          schema:
            type: string
            maxLength: 128
        - name: occurred_from
          in: query
          schema:
            type: string
            format: date-time
        - name: occurred_to
          in: query
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          description: Visible fields only.
          schema:
            type: string
            enum:
              - occurred_at
              - event_type
              - outcome
            default: occurred_at
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of audit rows the reader may see.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/SafetyPause"
  /audit/verify:
    post:
      tags:
        - audit
      operationId: verifyAuditChain
      summary: Verify the audit hash chain against the external anchor
      description: |
        Returns `OK` or `BROKEN` plus `first_bad_seq` and nothing else: no rows, no hashes. Checks contiguity, links,
        recomputed hashes and the latest anchor. Also runs nightly server-side.
      x-required-role: SENIOR
      x-jurisdiction: system-wide (SENIOR A/A/A)
      x-audit-event: AUDIT_VERIFY_RUN
      responses:
        "200":
          description: Verification result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditVerifyResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /stats/links:
    get:
      tags:
        - ingest
      operationId: getLinkTotals
      summary: System-wide link totals by state (ADMIN only)
      description: One object of totals. No parameters, no breakdown by state-of-case, district, case, entity type or officer, no time series, no list. Officer roles get 404; they keep ALLOW-only counts. `/review-queue` stays 404 for ADMIN.
      x-required-role: ADMIN
      x-jurisdiction: system-wide totals only (A/A/A); no case data
      x-audit-event: NONE
      x-audit-note: System-wide counts, no case data (ruling N2).
      responses:
        "200":
          description: Totals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkTotals"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: Any non-ADMIN caller.
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/SafetyPause"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token, 15 minutes. Algorithm pinned; `none` and algorithm switching are rejected. Role and jurisdiction are read from the database on every request, never from claims.
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque paging cursor from a previous response. Encrypted, bound to the reader and filters, expires after 15 minutes; any mismatch is 422 `VALIDATION_FAILED`.
      schema:
        $ref: "#/components/schemas/Cursor"
    CaseId:
      name: case_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    EntityId:
      name: entity_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    LinkId:
      name: link_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    StubId:
      name: stub_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    RequestId:
      name: request_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    GrantId:
      name: grant_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    BatchId:
      name: batch_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ChangeId:
      name: change_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
  responses:
    Unauthorized:
      description: Missing, malformed, expired or badly signed token, stale `ver`, dead session, or bad credentials. Audited (AUTH_TOKEN_REJECTED or AUTH_LOGIN_FAILED).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: UNAUTHENTICATED
            message_key: error.unauthenticated
    Forbidden:
      description: The caller can see the thing but their role does not permit the action. Audited (ACCESS_DENIED). Never used to hide that something exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: FORBIDDEN
            message_key: error.forbidden
    NotFound:
      description: Unknown or not visible to the caller. Body and headers are identical for both. Audited (ACCESS_DENIED, target UNRESOLVED, no case reference).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message_key: error.not_found
    Conflict:
      description: The state does not allow it (invalid transition, stale hash, cooldown, last approver, run in progress).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INVALID_TRANSITION
            message_key: error.invalid_transition
    Unprocessable:
      description: Input invalid, including a bad or foreign cursor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: VALIDATION_FAILED
            message_key: error.validation_failed
            field_errors:
              - field: reason
                code: too_short
    SafetyPause:
      description: The audit chain does not verify, or has not been verified yet, so the API is paused for safety. Every route except `GET /health`, `GET /ready` and `POST /audit/verify` answers this until a verify passes. The body is fixed, carries no data, and the client shows the safety-pause message.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SafetyPauseError"
          example:
            code: NOT_READY
            message_key: error.not_ready
    TooManyRequests:
      description: Login throttled (5 failures per username string and IP in 15 minutes), applied whether or not the username exists.
      headers:
        Retry-After:
          description: Seconds until sign-in may be tried again.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: TOO_MANY_REQUESTS
            message_key: error.too_many_requests
    ServerError:
      description: "Includes failure to append the audit row (fail closed): no data is returned."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INTERNAL
            message_key: error.internal
  schemas:
    Uuid:
      type: string
      format: uuid
    Id:
      type: string
      minLength: 1
      maxLength: 64
      description: Case or entity id as issued by the API (a UUID or the seeded id such as `C-101`). Opaque to clients.
    Cursor:
      type: string
      pattern: ^[A-Za-z0-9_-]{16,1024}$
      description: Opaque encrypted token. Do not parse; it carries no sequence number or id.
    Role:
      type: string
      enum:
        - JUNIOR
        - INVESTIGATOR
        - SUPERVISOR
        - SENIOR
        - ADMIN
    EntityType:
      type: string
      enum:
        - PERSON
        - ORG
        - PHONE
        - ACCOUNT
        - VEHICLE
    LinkState:
      type: string
      enum:
        - AUTO
        - SUGGESTED
        - CONFIRMED
        - REJECTED
        - UNDONE
    Band:
      type: string
      enum:
        - HIGH
        - MEDIUM
        - LOW
    ErrorCode:
      type: string
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - INVALID_TRANSITION
        - STATE_MISMATCH
        - REQUEST_COOLDOWN
        - REQUEST_LIMIT
        - NOT_PENDING
        - CHANGE_HASH_STALE
        - OLD_VALUE_CHANGED
        - LAST_APPROVER
        - RUN_IN_PROGRESS
        - VALIDATION_FAILED
        - TOO_MANY_REQUESTS
        - NOT_READY
        - INTERNAL
    SafetyPauseError:
      type: object
      description: Body of the safety-pause 503. Both values are fixed.
      additionalProperties: false
      required:
        - code
        - message_key
      properties:
        code:
          type: string
          enum:
            - NOT_READY
        message_key:
          type: string
          enum:
            - error.not_ready
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message_key
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message_key:
          type: string
          pattern: ^error\.[a-z_]+$
          description: i18n key; the client owns the wording. Fixed per code.
        field_errors:
          type: array
          description: 422 only. Field names and codes only, never echoing submitted values.
          items:
            type: object
            additionalProperties: false
            required:
              - field
              - code
            properties:
              field:
                type: string
              code:
                type: string
                pattern: ^[a-z_]+$
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
          format: password
          writeOnly: true
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 16
          maxLength: 2048
    TokenPair:
      type: object
      additionalProperties: false
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - refresh_expires_in
        - user
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          const: 900
          description: Seconds (15 minutes).
        refresh_expires_in:
          type: integer
          description: Seconds left of the 8 hour absolute lifetime.
        user:
          $ref: "#/components/schemas/User"
    Coverage:
      type: object
      additionalProperties: false
      required:
        - state_ids
        - district_ids
      description: SENIOR coverage set. Seeded; one SENIOR covers all states. `all_states` must be a JSON boolean; `state_ids` and `district_ids` are lists of ids without duplicates; anything else is refused with 422.
      properties:
        all_states:
          type: boolean
          description: True for the central desk.
        state_ids:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
        district_ids:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
    User:
      type: object
      additionalProperties: false
      required:
        - user_id
        - username
        - display_name
        - role
        - active
      properties:
        user_id:
          $ref: "#/components/schemas/Uuid"
        username:
          type: string
        display_name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        district_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
          description: One district for JUNIOR to SUPERVISOR; null for SENIOR and ADMIN.
        coverage:
          oneOf:
            - $ref: "#/components/schemas/Coverage"
            - type: "null"
          description: SENIOR only.
        active:
          type: boolean
        assignment_count:
          type: integer
          minimum: 0
          description: Number of assigned cases; ids are never shown here.
    UserPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/User"
    RoleInfo:
      type: object
      additionalProperties: false
      required:
        - role
        - name_key
        - description_key
        - scope
      properties:
        role:
          $ref: "#/components/schemas/Role"
        name_key:
          type: string
          pattern: ^role\.[a-z_]+\.name$
        description_key:
          type: string
          pattern: ^role\.[a-z_]+\.description$
        scope:
          type: string
          enum:
            - DISTRICT
            - COVERAGE
            - NONE
    RoleList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoleInfo"
    District:
      type: object
      additionalProperties: false
      required:
        - district_id
        - name
      properties:
        district_id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
    State:
      type: object
      additionalProperties: false
      required:
        - state_id
        - name
        - districts
      properties:
        state_id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        districts:
          type: array
          items:
            $ref: "#/components/schemas/District"
    JurisdictionList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/State"
    PageBase:
      type: object
      required:
        - next_cursor
        - total
      properties:
        next_cursor:
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"
          description: Null on the last page and on every empty page.
        total:
          type: integer
          minimum: 0
          description: Counts only the items the caller may see (ALLOW), with the page's filters applied; never stubs, grant-only links or hidden items.
    CaseRefBase:
      # open on purpose: allOf composites close the whole object with unevaluatedProperties
      type: object
      required:
        - case_id
        - case_number
        - district_id
      properties:
        case_id:
          $ref: "#/components/schemas/Id"
        case_number:
          type: string
        title:
          type: string
        district_id:
          $ref: "#/components/schemas/Uuid"
    CaseRef:
      allOf:
        - $ref: "#/components/schemas/CaseRefBase"
      unevaluatedProperties: false
    CaseSummary:
      allOf:
        - $ref: "#/components/schemas/CaseRefBase"
        - type: object
          required:
            - opened_on
            - linked_item_count
          properties:
            opened_on:
              type: string
              format: date
            linked_item_count:
              type: integer
              minimum: 0
              description: Entities of this case that appear in other cases through ALLOW links.
            is_assigned:
              type: boolean
              description: True when the caller is assigned to the case.
      unevaluatedProperties: false
    CasePage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CaseSummary"
    EntitySummaryBase:
      # open on purpose: allOf composites close the whole object with unevaluatedProperties
      type: object
      required:
        - entity_id
        - case_id
        - type
        - display_value
        - masked
        - link_count
        - has_hidden_connection
        - needs_review
        - via_grant
      properties:
        entity_id:
          $ref: "#/components/schemas/Id"
        case_id:
          $ref: "#/components/schemas/Id"
        type:
          $ref: "#/components/schemas/EntityType"
        display_value:
          type: string
          description: Name, number or registration as stored, or its masked form when `masked` is true.
        masked:
          type: boolean
          description: True when any value in this object (`display_value`, a fact) was masked; the full value then appears nowhere in the response.
        link_count:
          type: integer
          minimum: 0
          description: ALLOW links only.
        has_hidden_connection:
          type: boolean
          description: True when at least one stub exists for this entity.
        needs_review:
          type: boolean
          description: An ALLOW SUGGESTED link waits on this entity.
        via_grant:
          type: boolean
          description: True when the caller reaches this entity only through a grant.
      allOf:
        - if:
            properties:
              via_grant:
                const: true
            required:
              - via_grant
          then:
            properties:
              link_count:
                const: 1
              has_hidden_connection:
                const: false
              needs_review:
                const: false
    EntitySummary:
      allOf:
        - $ref: "#/components/schemas/EntitySummaryBase"
      unevaluatedProperties: false
    EntityPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/EntitySummary"
    CaseEntitiesPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          required:
            - case
            - items
          properties:
            case:
              $ref: "#/components/schemas/CaseSummary"
            counts_by_type:
              type: object
              description: Entity count per type for the group headings.
              additionalProperties:
                type: integer
                minimum: 0
            items:
              type: array
              items:
                $ref: "#/components/schemas/EntitySummary"
    Provenance:
      type: object
      additionalProperties: false
      required:
        - case_id
        - document_id
        - line
      description: Where an entity came from. Pointers only; line text comes from the source-lines route under its own rule.
      properties:
        case_id:
          $ref: "#/components/schemas/Id"
        document_id:
          type: string
        line:
          type: integer
          minimum: 1
        page:
          type:
            - integer
            - "null"
          minimum: 1
        document_type:
          type:
            - string
            - "null"
    EntityFact:
      type: object
      additionalProperties: false
      required:
        - key
        - value
      properties:
        key:
          type: string
          pattern: ^[a-z_]+$
          description: i18n key suffix for the label (for example `age`, `address`).
        value:
          type: string
    EntityDetail:
      allOf:
        - $ref: "#/components/schemas/EntitySummaryBase"
        - type: object
          required:
            - case
            - facts
            - provenance
            - links
            - stubs
            - via_grant
          properties:
            case:
              $ref: "#/components/schemas/CaseRef"
            facts:
              type: array
              items:
                $ref: "#/components/schemas/EntityFact"
            provenance:
              type: array
              items:
                $ref: "#/components/schemas/Provenance"
            links:
              type: array
              maxItems: 50
              items:
                $ref: "#/components/schemas/LinkSummary"
            stubs:
              type: array
              items:
                $ref: "#/components/schemas/Stub"
            via_grant:
              type: boolean
              description: True when the caller sees this entity only through a grant.
      unevaluatedProperties: false
    SourceLine:
      type: object
      additionalProperties: false
      required:
        - line
        - text
      properties:
        line:
          type: integer
          minimum: 1
        page:
          type:
            - integer
            - "null"
          minimum: 1
        text:
          type: string
    SourceLines:
      type: object
      additionalProperties: false
      required:
        - document_id
        - case_id
        - document_type
        - lines
        - via_grant
      properties:
        document_id:
          type: string
        case_id:
          $ref: "#/components/schemas/Id"
        document_type:
          type: string
        lines:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/SourceLine"
        via_grant:
          type: boolean
    LinkEnd:
      type: object
      additionalProperties: false
      required:
        - entity
        - case
      properties:
        entity:
          $ref: "#/components/schemas/EntitySummary"
        case:
          $ref: "#/components/schemas/CaseRef"
    MainReason:
      type: object
      additionalProperties: false
      required:
        - template_key
        - params
      description: The highest-contribution support item of the explanation; the client renders it like any explanation line.
      properties:
        template_key:
          type: string
          pattern: ^match\.evidence\.[a-z_]+$
        params:
          type: object
        masked:
          type: boolean
          description: True when a param value was masked.
    LinkSummaryBase:
      # open on purpose: allOf composites close the whole object with unevaluatedProperties
      type: object
      required:
        - link_id
        - entity_type
        - state
        - band
        - score
        - ends
        - main_reason
        - updated_at
      properties:
        link_id:
          $ref: "#/components/schemas/Uuid"
        entity_type:
          $ref: "#/components/schemas/EntityType"
        state:
          $ref: "#/components/schemas/LinkState"
        band:
          $ref: "#/components/schemas/Band"
        score:
          type: number
          minimum: 0
          maximum: 100
        ends:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/LinkEnd"
        main_reason:
          $ref: "#/components/schemas/MainReason"
        updated_at:
          type: string
          format: date-time
    LinkSummary:
      allOf:
        - $ref: "#/components/schemas/LinkSummaryBase"
      unevaluatedProperties: false
    AllowedAction:
      type: string
      enum:
        - CONFIRM
        - REJECT
        - UNDO
        - REOPEN
    DecisionBlock:
      type: string
      description: "Why no decision is open to this caller, as a code the app maps to its sentence (design O6). ROLE_VIEW_ONLY: role below the needed one. CROSS_AREA_SENIOR_ONLY: the link joins two areas and the caller is not a SENIOR. COVERAGE_INCOMPLETE: a SENIOR who does not cover both ends. GRANT_READ_ONLY: access is by grant, which never qualifies. STATE_FINAL: no transition is legal from the current state for this role."
      enum:
        - ROLE_VIEW_ONLY
        - CROSS_AREA_SENIOR_ONLY
        - COVERAGE_INCOMPLETE
        - GRANT_READ_ONLY
        - STATE_FINAL
    HistoryEntry:
      type: object
      additionalProperties: false
      required:
        - from
        - to
        - at
        - actor_kind
        - actor
        - reason_code
      properties:
        from:
          oneOf:
            - $ref: "#/components/schemas/LinkState"
            - type: "null"
        to:
          oneOf:
            - $ref: "#/components/schemas/LinkState"
            - type: "null"
        at:
          type: string
          format: date-time
        actor_kind:
          type: string
          enum:
            - ENGINE
            - USER
        actor_user_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        actor:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
          description: The deciding person, only when the caller may already know them (access spec 4.2 - the caller is the actor, a SUPERVISOR in the chain of command, or a SENIOR who could read them through `GET /users/{user_id}`). Null otherwise, with no role, district or partial name; always null for an engine entry.
        reason_code:
          type:
            - string
            - "null"
          pattern: ^[A-Z_]+$
        reason_text:
          type:
            - string
            - "null"
          maxLength: 1000
          description: Free text from the deciding officer. Shown only to callers with ALLOW on both ends by their own scope; never under a grant.
    LinkDetail:
      allOf:
        - $ref: "#/components/schemas/LinkSummaryBase"
        - type: object
          required:
            - thresholds_version
            - ruleset_version
            - created_at
            - history
            - allowed_actions
            - via_grant
          properties:
            thresholds_version:
              type: integer
              minimum: 1
            ruleset_version:
              type: string
            created_at:
              type: string
              format: date-time
            history:
              type: array
              items:
                oneOf:
                  - $ref: "#/components/schemas/HistoryEntry"
                  - $ref: "#/components/schemas/HistoryEntryGranted"
            allowed_actions:
              type: array
              items:
                $ref: "#/components/schemas/AllowedAction"
            decision_block:
              oneOf:
                - $ref: "#/components/schemas/DecisionBlock"
                - type: "null"
            via_grant:
              type: boolean
          allOf:
            - if:
                properties:
                  via_grant:
                    const: true
                required:
                  - via_grant
              then:
                properties:
                  history:
                    items:
                      $ref: "#/components/schemas/HistoryEntryGranted"
      unevaluatedProperties: false
    LinkPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          required:
            - items
            - stubs
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/LinkSummary"
            stubs:
              type: array
              description: After the visible items, ordered by `stub_id`.
              items:
                $ref: "#/components/schemas/Stub"
    ReviewQueueItem:
      allOf:
        - $ref: "#/components/schemas/LinkSummaryBase"
        - type: object
          required:
            - waiting_since
            - allowed_actions
            - last_decision
          properties:
            waiting_since:
              type: string
              format: date-time
            allowed_actions:
              type: array
              items:
                $ref: "#/components/schemas/AllowedAction"
            last_decision:
              oneOf:
                - $ref: "#/components/schemas/LastDecision"
                - type: "null"
              description: The last human decision on a REJECTED or UNDONE item. Null for a SUGGESTED item.
      unevaluatedProperties: false
    LastDecision:
      type: object
      additionalProperties: false
      required:
        - to
        - at
        - actor
        - reason_text
      description: The last human decision on a queue item. `reason_text` follows the link history rule (access spec 4.2); queue items are ALLOW by own scope only, so every caller who gets the item gets the reason.
      properties:
        to:
          $ref: "#/components/schemas/LinkState"
        at:
          type: string
          format: date-time
        actor:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
          description: Same rule as `HistoryEntry.actor`.
        reason_text:
          type:
            - string
            - "null"
          maxLength: 1000
    ReviewQueuePage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ReviewQueueItem"
    ConfirmLinkRequest:
      type: object
      additionalProperties: false
      properties:
        expected_state:
          $ref: "#/components/schemas/LinkState"
    LinkReasonRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 1000
          description: Stored on the link history only; never in the audit log.
        expected_state:
          $ref: "#/components/schemas/LinkState"
    Explanation:
      $ref: explanation.schema.json
    AccessRequestStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - DENIED
        - WITHDRAWN
        - EXPIRED
    StubRequestState:
      type: string
      enum:
        - NONE
        - PENDING
        - DENIED
        - EXPIRED
    Stub:
      type: object
      additionalProperties: false
      required:
        - redacted
        - stub_id
        - near_entity_id
        - connection_exists
        - access_request
        - message_key
      description: |
        One hidden link, same shape whatever its state. It never carries a far case id, number, title, district or
        officer; a far entity id, type, name or value; or a link id, state, score, band, tier, signals, evidence count,
        creation time or run id.
      properties:
        redacted:
          type: boolean
          const: true
        stub_id:
          $ref: "#/components/schemas/Uuid"
        near_entity_id:
          $ref: "#/components/schemas/Id"
        connection_exists:
          type: boolean
          const: true
        access_request:
          type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              $ref: "#/components/schemas/StubRequestState"
            requested_at:
              type:
                - string
                - "null"
              format: date-time
        message_key:
          type: string
          const: access.stub.connection_exists
    CreateAccessRequest:
      type: object
      additionalProperties: false
      required:
        - stub_id
        - reason
      properties:
        stub_id:
          $ref: "#/components/schemas/Uuid"
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: No personal data. Stored on the request only.
    ApproveAccessRequest:
      type: object
      additionalProperties: false
      properties:
        duration_days:
          type: integer
          enum:
            - 7
            - 30
            - 90
          default: 30
    DenyAccessRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 200
          description: Shown to the requester. Must carry no case detail (names, numbers, places); the UI says so. Stored on the request, never in the audit log.
    GrantStatus:
      type: string
      enum:
        - ACTIVE
        - EXPIRED
        - REVOKED
    GrantCloseCause:
      type: string
      enum:
        - MANUAL
        - ROLE_CHANGE
        - LINK_CLOSED
        - EVIDENCE_CHANGED
        - TIME
    Grant:
      oneOf:
        - $ref: "#/components/schemas/GrantHeld"
        - $ref: "#/components/schemas/GrantAuthority"
      discriminator:
        propertyName: view
        mapping:
          HELD: "#/components/schemas/GrantHeld"
          AUTHORITY: "#/components/schemas/GrantAuthority"
    GrantPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Grant"
    UserRef:
      type: object
      additionalProperties: false
      required:
        - user_id
        - display_name
        - role
      properties:
