  /pending-changes/{change_id}/approve:
    post:
      tags:
        - admin
      operationId: approveChange
      summary: Approve a pending change and apply it
      description: |
        The approver presents the `change_hash` they saw. A changed proposal is a new record needing new approval
        (409 `CHANGE_HASH_STALE`). If the current value no longer equals `old_value`, 409 `OLD_VALUE_CHANGED`.
        Disabling or moving the last SENIOR able to approve a jurisdiction is refused (409 `LAST_APPROVER`). Not the
        proposer and not the subject (403). Applying a change that alters a user's role, jurisdiction, assignment or
        active flag bumps that user's `authz_version`: old tokens 401, refresh tokens revoked, grants closed.
      x-required-role: SENIOR
      x-jurisdiction: "SENIOR whose coverage includes every jurisdiction the change touches, old and new (an assignment change also the district of the case; USER_CREATE and USER_JURISDICTION: new coverage a subset of the approver's); an ADMIN subject, a role change to or from SENIOR or ADMIN, and thresholds need all-state coverage; otherwise 404"
      x-audit-event: CHANGE_APPROVED
      x-audit-note: When applied, also USER_CREATED / USER_ENABLED / USER_DISABLED / ASSIGNMENT_CHANGED, and ACCESS_GRANT_CLOSED (cause ROLE_CHANGE) for closed grants.
      parameters:
        - $ref: "#/components/parameters/ChangeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveChangeRequest"
      responses:
        "200":
          description: The change, now APPROVED and applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingChange"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/SafetyPause"
  /pending-changes/{change_id}/deny:
    post:
      tags:
        - admin
      operationId: denyChange
      summary: Deny a pending change
      x-required-role: SENIOR
      x-jurisdiction: "SENIOR whose coverage includes every jurisdiction the change touches, old and new (an assignment change also the district of the case; USER_CREATE and USER_JURISDICTION: new coverage a subset of the approver's); an ADMIN subject, a role change to or from SENIOR or ADMIN, and thresholds need all-state coverage; otherwise 404"
      x-audit-event: CHANGE_DENIED
      parameters:
