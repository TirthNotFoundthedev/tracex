        requested_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Seven days after the request.
        decided_at:
          type:
            - string
            - "null"
          format: date-time
        reason:
          type: string
        requester:
          $ref: "#/components/schemas/UserRef"
        far_case_id:
          $ref: "#/components/schemas/Id"
        far_case_number:
          type: string
          description: Case number of the far case, which lies in the decider's own district (SUPERVISOR) or coverage (SENIOR). No other far-case field is carried. AccessRequestMine never carries it.
        stub:
          $ref: "#/components/schemas/Stub"
        grant:
          oneOf:
            - $ref: "#/components/schemas/GrantAuthority"
            - type: "null"
    HistoryEntryGranted:
      type: object
      additionalProperties: false
      required:
        - from
        - to
        - at
        - reason_code
      description: "History under a grant: only from, to, at and reason_code, as in the explanation payload. No actor and no free text."
      properties:
        from:
          oneOf:
            - $ref: "#/components/schemas/LinkState"
            - type: "null"
        to:
          oneOf:
            - $ref: "#/components/schemas/LinkState"
            - type: "null"
        at:
          type: string
          format: date-time
        reason_code:
          type:
            - string
            - "null"
          pattern: ^[A-Z_]+$
    AuditDetail:
      type: object
      additionalProperties: false
      description: Allow-listed keys only (audit spec section 3), further narrowed per event by `x-detail-keys`. Keys that carry a sequence number or chain position (`seq_from`, `seq_to`, `range_from`, `range_to`, `first_bad_seq`, `head_seq`, `anchor_seq`) are stored but never returned. Keys the reader may not see are absent, not null.
      properties:
        schema_version:
          type: integer
        claimed_username:
          type: string
        throttled:
          type: boolean
        via_grant:
          type: boolean
          description: Present on every view event (audit spec section 3); true when access came from a grant.
        failure:
          type: string
          pattern: ^[A-Z_]+$
        claimed_sub:
          type: string
        case_ids:
          type: array
          maxItems: 500
          items:
            type: string
        entity_ids:
          type: array
          maxItems: 500
          items:
            type: string
        link_ids_shown:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
        link_ids:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
        stub_ids_shown:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
        stub_ids:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
        near_entity_ids:
          type: array
          items:
            type: string
        request_ids:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
        grant_ids:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
        change_ids:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
        entity_type_filter:
          type: string
        action:
          type: string
        http_status:
          type: integer
        run_id:
          $ref: "#/components/schemas/Uuid"
        band:
          $ref: "#/components/schemas/Band"
        score:
          type: number
        previous_state:
          type: string
        new_state:
          type: string
        cause:
          type: string
          pattern: ^[A-Z_]+$
        stub_id:
          $ref: "#/components/schemas/Uuid"
        grant_id:
          $ref: "#/components/schemas/Uuid"
        expires_at:
          type: string
          format: date-time
        line_from:
          type: integer
        line_to:
          type: integer
        file_sha256:
          type: string
        byte_count:
          type: integer
        document_count:
          type: integer
        thresholds_version:
          type: integer
        auto_count:
          type: integer
        suggested_count:
          type: integer
        kind:
          $ref: "#/components/schemas/ChangeKind"
        subject_id:
