          type: string
          enum:
            - OK
            - BROKEN
        first_bad_seq:
          type:
            - integer
            - "null"
          minimum: 1
          description: Present only with BROKEN, only to a SENIOR. The single place a sequence number leaves the API (D38, as amended).
    StartRunRequest:
      type: object
      additionalProperties: false
      properties:
