          properties:
            case_number:
              type: string
              minLength: 1
              maxLength: 64
    ProposeThresholds:
      type: object
      additionalProperties: false
      required:
        - kind
        - new_value
      properties:
        kind:
          type: string
          const: THRESHOLDS
        new_value:
          type: object
          additionalProperties: false
          required:
            - high_min
            - medium_min
          properties:
            high_min:
              type: number
              minimum: 70
              maximum: 100
            medium_min:
              type: number
              minimum: 30
              maximum: 90
    ProposeChangeRequest:
      description: Closed per change type. A key that the type does not list, at the top level or in `new_value` or in `coverage`, is refused with 422 `unknown_field`; the stored, shown and applied value is built from the listed keys only.
      oneOf:
        - $ref: "#/components/schemas/ProposeUserCreate"
        - $ref: "#/components/schemas/ProposeUserActive"
        - $ref: "#/components/schemas/ProposeUserRole"
        - $ref: "#/components/schemas/ProposeUserJurisdiction"
        - $ref: "#/components/schemas/ProposeAssignment"
        - $ref: "#/components/schemas/ProposeThresholds"
    PendingChange:
      type: object
