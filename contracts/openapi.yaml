        - state
        - old_value
        - new_value
        - proposer
        - change_hash
        - proposed_at
      properties:
        change_id:
          $ref: "#/components/schemas/Uuid"
        kind:
          $ref: "#/components/schemas/ChangeKind"
        state:
          $ref: "#/components/schemas/ChangeState"
        subject:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
