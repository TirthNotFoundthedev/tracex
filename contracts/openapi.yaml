          type:
            - object
            - "null"
          description: Recorded by the server at proposal time.
        new_value:
          type: object
        proposer:
          $ref: "#/components/schemas/UserRef"
        decider:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        change_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 of the canonical content.
        proposed_at:
          type: string
          format: date-time
        decided_at:
          type:
            - string
            - "null"
          format: date-time
    PendingChangePage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PendingChange"
    ApproveChangeRequest:
      type: object
      additionalProperties: false
      required:
        - change_hash
      properties:
        change_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
