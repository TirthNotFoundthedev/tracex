        ruleset_version:
          type: string
        thresholds_version:
          type: integer
          minimum: 1
        oversized_block_count:
          type: integer
          minimum: 0
        error_code:
          type:
            - string
            - "null"
          pattern: ^[A-Z_]+$
        input_batch_count:
          type: integer
          minimum: 0
        auto_created:
          type: integer
          minimum: 0
        suggested_created:
          type: integer
