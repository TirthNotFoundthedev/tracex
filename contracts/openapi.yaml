      operationId: proposeChange
      summary: Propose a change to users, roles, jurisdictions, assignments or thresholds
      description: |
        Nothing applies until a SENIOR approves. The server records `old_value` itself and computes `change_hash`
        (SHA-256 of the canonical content). Thresholds: 70 <= high_min <= 100 and 30 <= medium_min <= high_min - 10.
        Case assignments name the case by `case_number`; an unknown number answers the same 422 as an invalid one.
        USER_CREATE makes an account with no usable password; a login for it fails exactly like a wrong password. No route sets or resets a password.
      x-required-role: ADMIN
      x-jurisdiction: system-wide (A/A/A); the proposal exposes no case data
      x-audit-event: CHANGE_PROPOSED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeChangeRequest"
      responses:
        "201":
          description: Proposal recorded, state PENDING.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingChange"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/SafetyPause"
    get:
      tags:
        - admin
      operationId: listPendingChanges
      summary: Pending changes the caller proposed or may decide
      description: ADMIN sees changes they proposed. A SENIOR sees changes whose every touched jurisdiction (the subject's old and new district, the district of an assignment's case) lies in their coverage; threshold changes, ADMIN subjects and role changes to or from SENIOR or ADMIN only to an all-state SENIOR. Others do not exist for the caller.
      x-required-role: SENIOR or ADMIN
      x-jurisdiction: "ADMIN: own proposals. SENIOR: changes whose every touched jurisdiction is inside coverage (all-state coverage for thresholds, ADMIN subjects, role changes to or from SENIOR or ADMIN)."
      x-audit-event: CHANGE_VIEWED
      x-audit-note: Writes `change_ids`; refs are the case of any assignment change.
      parameters:
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/ChangeState"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/ChangeKind"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of changes.
          content:
            application/json:
