          $ref: "#/components/schemas/Uuid"
        request_id:
          $ref: "#/components/schemas/Uuid"
        status:
          $ref: "#/components/schemas/GrantStatus"
        starts_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        closed_at:
          type:
            - string
            - "null"
          format: date-time
        close_cause:
          oneOf:
            - $ref: "#/components/schemas/GrantCloseCause"
