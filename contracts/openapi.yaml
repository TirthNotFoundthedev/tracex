    AuditActor:
      type: object
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - USER
            - SYSTEM
            - ANONYMOUS
        user_id:
          $ref: "#/components/schemas/Uuid"
        role:
          $ref: "#/components/schemas/Role"
        district_id:
          $ref: "#/components/schemas/Uuid"
    AuditCaseRef:
      type: object
      additionalProperties: false
      required:
        - case_id
        - district_id
      properties:
        case_id:
          $ref: "#/components/schemas/Id"
        district_id:
          $ref: "#/components/schemas/Uuid"
    AuditRow:
      type: object
      additionalProperties: false
      required:
        - row_ref
        - occurred_at
        - event_type
        - outcome
        - actor
        - refs
      description: |
        Never contains a sequence number, event id, hash, nonce, session id, request id or client address. Keys the
        reader may not see are absent, not null. `target_id` of an UNRESOLVED target is the string the caller supplied.
      properties:
        row_ref:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,128}$
          description: Opaque; HMAC of the row and the reader. Two readers get different values for the same row.
        occurred_at:
          type: string
          format: date-time
        event_type:
          $ref: "#/components/schemas/AuditEventType"
        outcome:
          type: string
          enum:
            - SUCCESS
            - DENIED
            - FAILED
        actor:
          $ref: "#/components/schemas/AuditActor"
        reason_code:
          type: string
          pattern: ^[A-Z0-9_]+$
        refs:
          type: array
          description: Only the cases the reader may see. Empty for system events and for R2_NOT_VISIBLE denials.
          items:
            $ref: "#/components/schemas/AuditCaseRef"
        target_type:
          type: string
          enum:
            - CASE
            - ENTITY
            - LINK
            - STUB
            - DOCUMENT
            - USER
            - ACCESS_REQUEST
            - GRANT
            - BATCH
            - RUN
            - SETTING
            - CHANGE
            - AUDIT
            - UNRESOLVED
        target_id:
          type: string
        detail:
          $ref: "#/components/schemas/AuditDetail"
    AuditPage:
      type: object
      additionalProperties: false
      required:
