          minimum: 1
        effective_at:
          type: string
          format: date-time
    ChangeKind:
      type: string
      enum:
        - USER_CREATE
        - USER_ENABLE
        - USER_DISABLE
        - USER_ROLE
        - USER_JURISDICTION
        - ASSIGNMENT_ADD
        - ASSIGNMENT_REMOVE
        - THRESHOLDS
    ChangeState:
      type: string
      enum:
        - PENDING
        - APPROVED
        - DENIED
    ProposeUserCreate:
      type: object
      additionalProperties: false
      required:
        - kind
        - new_value
      properties:
        kind:
          type: string
          const: USER_CREATE
        new_value:
          type: object
          additionalProperties: false
          description: "`district_id` for district roles, `coverage` for SENIOR; never both (422)."
          required:
            - username
            - display_name
            - role
          not:
            required:
              - district_id
              - coverage
          properties:
            username:
              type: string
              minLength: 3
              maxLength: 64
              pattern: ^[a-z0-9._-]+$
            display_name:
              type: string
              minLength: 1
              maxLength: 120
            role:
              $ref: "#/components/schemas/Role"
            district_id:
              $ref: "#/components/schemas/Uuid"
            coverage:
              $ref: "#/components/schemas/Coverage"
    ProposeUserActive:
      type: object
      additionalProperties: false
      required:
        - kind
        - subject_user_id
      properties:
        kind:
          type: string
          enum:
            - USER_ENABLE
            - USER_DISABLE
        subject_user_id:
          $ref: "#/components/schemas/Uuid"
