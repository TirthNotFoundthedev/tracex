        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/SafetyPause"
  /pending-changes/{change_id}:
    get:
      tags:
        - admin
      operationId: getPendingChange
      summary: One pending change
      x-required-role: SENIOR or ADMIN
      x-jurisdiction: "ADMIN: own proposals. SENIOR: every touched jurisdiction inside coverage. Others 404."
      x-audit-event: CHANGE_VIEWED
      x-audit-note: Writes `change_ids`; refs are the case of any assignment change.
