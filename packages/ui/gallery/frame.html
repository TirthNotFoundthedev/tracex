<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TraceX gallery frame</title>
    <!--
      Review tool. Edge headless cannot make a window narrower than about 500px, so the
      phone screenshots load the gallery inside a frame of true width.
      Use frame.html?w=375&app=officer&lang=hi
    -->
  </head>
  <body style="margin: 0">
    <iframe id="f" title="gallery" style="border: 0; display: block"></iframe>
    <script>
      const q = new URLSearchParams(location.search);
      const f = document.getElementById("f");
      f.style.width = q.get("w") + "px";
      f.style.height = "900px";
      f.src = "./index.html?app=" + q.get("app") + "&lang=" + q.get("lang");
      f.onload = () =>
        setTimeout(() => {
          const d = f.contentDocument.documentElement;
          f.style.height = d.scrollHeight + "px";
          document.title =
            "h=" +
            d.scrollHeight +
            " w=" +
            d.scrollWidth +
            " vw=" +
            f.contentWindow.innerWidth +
            " | " +
            f.contentDocument.title;
        }, 2500);
    </script>
  </body>
</html>
