[project]
name = "tracex"
version = "0.1.0"
description = "TraceX backend: entity-resolution engine and API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "jsonschema==4.24.1",
    "mypy>=1.13",
    "openapi-spec-validator==0.8.4",
    "pytest>=8.3",
    "pyyaml==6.0.3",
    "ruff>=0.8",
    "types-jsonschema==4.24.0.20250708",
    "types-pyyaml==6.0.12.20250915",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracex_engine", "tracex_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["tracex_engine", "tracex_api", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
